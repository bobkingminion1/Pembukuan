  impSimpan() {
    const pilih = IMP.rows.filter(r => r.pakai);
    if (!pilih.length) { toast('Pilih minimal satu baris.', true); return; }
    const list = pilih.map((r, i) => ({ id: uid() + i.toString(36), tgl: r.tgl, jenis: r.jenis, akun: IMP.akun, lawan: r.lawan, ket: r.ket, jml: r.jml, ref: '' }));
    if (!Store.simpanTxBanyak(list)) return;
    const th = Math.max.apply(null, list.map(t => +t.tgl.slice(0, 4)));
    UI.tahun = th; UI.page = 'kas-bank'; UI.kas.rek = IMP.akun;
    tutupModal(); toast(list.length + ' transaksi dari mutasi bank dicatat.');
  },

  tambahJr() { bukaJr(null); },
  editJr(el) { bukaJr(el.dataset.id); },
  jrTemplate(el) {
    const t = TEMPLATE_JR[+el.dataset.i]; bacaBarisJr();
    JR.baris[0].akun = M.am[t[1]] ? t[1] : ''; JR.baris[1].akun = M.am[t[2]] ? t[2] : '';
    if (!$('#jr-ket').value) $('#jr-ket').value = t[0];
    $('#jr-baris').innerHTML = barisJrHtml(); totalJr();
  },
  jrTambahBaris() { bacaBarisJr(); JR.baris.push({ akun: '', d: 0, k: 0 }); $('#jr-baris').innerHTML = barisJrHtml(); totalJr(); },
  jrHapusBaris(el) { bacaBarisJr(); JR.baris.splice(+el.dataset.i, 1); while (JR.baris.length < 2) JR.baris.push({ akun: '', d: 0, k: 0 }); $('#jr-baris').innerHTML = barisJrHtml(); totalJr(); },
  simpanJr() { simpanJr(); },
  hapusJr(el) { two(el, () => { if (Store.hapusJr(JR.id)) toast('Jurnal dihapus.'); tutupModal(); }); },

  mulaiBaru() {
    const nama = $('#w-nama').value.trim(), th = parseInt($('#w-tahun').value, 10), err = $('#w-err');
    if (!nama) { err.textContent = 'Isi nama perusahaan.'; $('#w-nama').focus(); return; }
    if (!(th >= 2000 && th <= 2100)) { err.textContent = 'Isi tahun mulai dengan benar, mis. ' + new Date().getFullYear() + '.'; return; }
    if (Store.gantiSemua(mulaiDariKosong(nama, th, $('#w-bentuk').value), {})) { UI.tahun = th; UI.tahunSet = true; UI.page = 'ringkasan'; toast('Pembukuan dibuat. Mulai dengan mengisi saldo awal.'); }
  },
  muatContoh() { const d = buildDemo(); if (Store.gantiSemua(d.config, d.months)) { UI.tahunSet = false; UI.page = 'ringkasan'; } },
  muatContohKonfirm() { konfirmasi('Ganti dengan data contoh?', 'Seluruh data pembukuan Anda saat ini akan <b>diganti</b> dengan data contoh perusahaan fiktif. Unduh cadangan dulu bila perlu.', 'Ganti dengan data contoh', () => ACT.muatContoh(), true); },
  mulaiSendiri() {
    konfirmasi('Hapus data contoh?', 'Semua data contoh dihapus dan Anda mulai dengan pembukuan kosong. Bagan akun standar tetap disiapkan.', 'Hapus dan mulai', () => {
      if (Store.gantiSemua(mulaiDariKosong('Perusahaan Saya', new Date().getFullYear()), {})) { UI.tahun = new Date().getFullYear(); UI.tahunSet = true; UI.page = 'pengaturan'; UI.set.tab = 'profil'; toast('Silakan isi profil perusahaan Anda.'); }
    }, true);
  },
  hapusSemua() {
    konfirmasi('Hapus semua data?', 'Transaksi, jurnal, dan saldo awal akan dihapus permanen. Profil perusahaan dipertahankan. Unduh cadangan dulu bila perlu.', 'Hapus semua', () => {
      const cfg = mulaiDariKosong(M.cfg.perusahaan.nama, new Date().getFullYear()); cfg.perusahaan = M.cfg.perusahaan;
      if (Store.gantiSemua(cfg, {})) { UI.tahun = new Date().getFullYear(); UI.tahunSet = true; toast('Semua data dihapus.'); }
    }, true);
  },

  simpanProfil() {
    const v = k => $('#p-' + k).value.trim();
    if (!v('nama')) { toast('Nama perusahaan wajib diisi.', true); return; }
    if (Store.ubahConfig(c => { ['bentuk', 'nama', 'bidang', 'alamat', 'kota', 'npwp', 'direktur', 'jabatanDirektur', 'keuangan', 'jabatanKeuangan'].forEach(k => { c.perusahaan[k] = v(k); }); })) toast('Profil disimpan.');
  },
  simpanSaldo() {
    const tgl = $('#sa-tgl').value; if (!tglValid(tgl)) { toast('Isi tanggal saldo awal.', true); return; }
    const r = hitungSaldoAwal();
    if (Store.ubahConfig(c => { c.saldoAwal = { tgl, nilai: r.nilai }; })) toast(Math.abs(r.selisih) < 0.5 ? 'Saldo awal disimpan.' : 'Saldo awal disimpan, tetapi belum seimbang (selisih ' + rp(r.selisih) + ').', Math.abs(r.selisih) >= 0.5);
  },
  saldoSeimbangkan() {
    const r = hitungSaldoAwal();
    if (Math.abs(r.selisih) < 0.5) { toast('Saldo awal sudah seimbang.'); return; }
    const kode = M.am['3-2000'] ? '3-2000' : (M.akun.find(a => a.tipe === 'ekuitas') || {}).kode;
    const el = document.querySelector('[data-sa="' + kode + '"]'); if (!el) return;
    el.value = fmtN.format(bacaUang(el) + r.selisih); hitungSaldoAwal();
  },
  tambahAkun() { bukaAkun(null); },
  editAkun(el) { bukaAkun(el.dataset.k); },
  simpanAkun(el) {
    const err = $('#ak-err'), ada = el.dataset.k ? M.am[el.dataset.k] : null;
    const kode = $('#ak-kode').value.trim(), nama = $('#ak-nama').value.trim(), tipe = $('#ak-tipe').value, kas = $('#ak-kas').value === '1', arus = $('#ak-arus').value, normal = $('#ak-normal').value;
    if (!/^[A-Za-z0-9._-]{1,20}$/.test(kode)) { err.textContent = 'Kode hanya boleh huruf, angka, titik, atau strip (maksimal 20 karakter).'; return; }
    if (!ada && M.am[kode]) { err.textContent = 'Kode ' + kode + ' sudah dipakai akun lain.'; return; }
    if (!nama) { err.textContent = 'Isi nama akun.'; return; }
    if (kas && tipe !== 'aset_lancar') { err.textContent = 'Rekening kas dan bank harus berjenis Aset Lancar.'; return; }
    const baru = { kode, nama, tipe };
    if (kas) baru.kas = true;
    if (arus) baru.arus = arus;
    if (normal && normal !== TIPE[tipe].normal) baru.normal = normal;
    if (Store.ubahConfig(c => { const i = c.akun.findIndex(a => a.kode === kode); if (i >= 0) c.akun[i] = baru; else c.akun.push(baru); })) { toast('Akun disimpan.'); tutupModal(); }
  },
  hapusAkun(el) {
    const k = el.dataset.k; if (akunDipakai(Store.S, k)) { toast('Akun ini sudah dipakai, tidak bisa dihapus.', true); return; }
    if (Store.ubahConfig(c => { c.akun = c.akun.filter(a => a.kode !== k); c.aturan = (c.aturan || []).filter(r => r.akun !== k); })) { toast('Akun dihapus.'); tutupModal(); }
  },
  tambahAturan() {
    const kata = $('#ar-kata').value.trim(), err = $('#ar-err');
    if (!kata) { err.textContent = 'Isi kata kunci.'; return; }
    const r = { kata: kata.toUpperCase(), akun: $('#ar-akun').value, arah: $('#ar-arah').value };
    if (Store.ubahConfig(c => { c.aturan = [r].concat(c.aturan || []); })) toast('Aturan ditambahkan di urutan teratas.');
  },
  hapusAturan(el) { Store.ubahConfig(c => { c.aturan.splice(+el.dataset.i, 1); }); },
  aturanBawaan() { konfirmasi('Pulihkan aturan bawaan?', 'Daftar aturan Anda diganti dengan aturan bawaan.', 'Pulihkan', () => Store.ubahConfig(c => { c.aturan = clone(DEFAULT_ATURAN); }), false); },

  unduhCadangan() { simpanBerkas('cadangan-pembukuan-' + hariIni() + '.json', JSON.stringify(Store.cadangan())); },
  unduhLaporan() { unduhLaporan(); },
  unduhRekap() { unduhRekap(); },
  unduhExcel() { unduhExcel(); },
  unduhPdf() { unduhPdf(); },
};
const ACTC = {
  txAkun() { if (TX && TX.jenis === 'transfer') isiLawan('transfer', $('#f-lawan').value); },
  simpanTeks(el) {
    const th = UI.tahun, f = el.dataset.f, v = el.value.trim();
    Store.ubahConfig(c => { c.laporan = c.laporan || {}; c.laporan[th] = c.laporan[th] || {}; c.laporan[th][f] = v; });
    toast('Teks laporan disimpan.');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.ui) { setUiPath(t.dataset.ui, t.dataset.num ? +t.value : t.value); render(); return; }
  if (t.dataset.actChange && ACTC[t.dataset.actChange]) { ACTC[t.dataset.actChange](t); return; }
  if (t.dataset.imp === 'pakai') { IMP.rows[+t.dataset.i].pakai = t.checked; ubahTxJumlahImpor(); return; }
  if (t.dataset.imp === 'lawan') { IMP.rows[+t.dataset.i].lawan = t.value; return; }
  if (t.dataset.jr === 'akun') { totalJr(); return; }
  if (t.id === 'imp-file' && t.files && t.files[0]) bacaBerkasTeks(t.files[0], txt => { $('#imp-teks').value = txt; });
  if (t.id === 'pulih-file' && t.files && t.files[0]) {
    bacaBerkasTeks(t.files[0], txt => {
      try {
        const d = JSON.parse(txt);
        if (!d || !d.config || !Array.isArray(d.config.akun) || typeof d.months !== 'object') throw new Error('format');
        Object.keys(d.months).forEach(k => { d.months[k].tx = d.months[k].tx || []; d.months[k].jr = d.months[k].jr || []; });
        konfirmasi('Pulihkan dari cadangan?', 'Data saat ini akan <b>diganti</b> dengan isi cadangan (' + Object.keys(d.months).length + ' bulan data).', 'Pulihkan', () => { if (Store.gantiSemua(d.config, d.months)) { UI.tahunSet = false; toast('Data dipulihkan dari cadangan.'); } }, true);
      } catch (err) { toast('Berkas bukan cadangan pembukuan yang valid.', true); }
    });
    t.value = '';
  }
});
let tunda = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('uang')) {
    const pos = t.selectionStart, neg = t.dataset.neg && /^\s*-/.test(t.value);
    const sebelum = t.value.slice(0, pos).replace(/\D/g, '').length, digit = t.value.replace(/\D/g, '');
    t.value = (neg ? '-' : '') + (digit ? fmtN.format(+digit) : '');
    let c = 0, i = 0; for (; i < t.value.length && c < sebelum; i++) if (/\d/.test(t.value[i])) c++;
    try { t.setSelectionRange(i, i); } catch (er) { /* abaikan */ }
    if (t.dataset.jr) totalJr();
    if (t.dataset.sa) hitungSaldoAwal();
    return;
  }
  if (t.dataset && t.dataset.uiq) { clearTimeout(tunda); tunda = setTimeout(() => { setUiPath(t.dataset.uiq, t.value); render(); }, 140); return; }
  if (t.id === 'f-ket') { saranAkun(); return; }
  if (t.id === 'jr-ket') return;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalTerbuka()) { tutupModal(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.matches && t.matches('tr.klik')) { t.click(); return; }
  if (t.tagName === 'INPUT' && t.type !== 'checkbox' && t.type !== 'file' && $('#modal').contains(t)) {
    if ($('#f-jml') && TX) { e.preventDefault(); simpanTx(false); }
    else if ($('#jr-tgl') && JR && t.id !== 'imp-teks') { e.preventDefault(); simpanJr(); }
    else if ($('#ak-kode')) { e.preventDefault(); const b = $('.md-f .btn.pri'); if (b) b.click(); }
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (PAGES.some(p => p.id === h) && h !== UI.page) { UI.page = h; render(); } });

(function mulai() {
  const h = (location.hash || '').replace('#', '');
  if (PAGES.some(p => p.id === h)) UI.page = h;
  Store.onChange(render);
  Store.onError(e => toast((e && e.message) || 'Terjadi kesalahan saat menyimpan.', true));
  render();
  Store.init().then(render).catch(e => { console.error(e); toast('Penyimpanan gagal dimulai.', true); render(); });
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
</body>
</html>
