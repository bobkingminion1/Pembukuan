<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14221c">
<meta name="description" content="Aplikasi pembukuan untuk usaha: catat kas dan bank, lalu laba rugi, neraca, arus kas, rekap bulanan, dan laporan tahunan tersusun otomatis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pembukuan Perusahaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Konsep tata letak: rel navigasi hijau tua seperti sampul buku besar di kiri, kertas kerja hijau-abu di kanan.
   Angka memakai Plex Sans tabular, kode akun memakai Plex Mono, judul laporan formal memakai Newsreader. */
:root {
  --bg: #ecefeb;
  --surface: #fafbf9;
  --surface-2: #e4e9e2;
  --line: #d2dacf;
  --line-soft: #e3e8e0;
  --ink: #16201a;
  --ink-2: #44534a;
  --ink-3: #5e6d64;
  --accent: #0a6a58;
  --accent-ink: #ffffff;
  --accent-soft: #d3e8e1;
  --neg: #b42318;
  --pos: #0b6b32;
  --warn: #8a5300;
  --warn-bg: #f8ebc9;
  --bad-bg: #f9dcd8;
  --ok-bg: #d5ecdc;
  --side-bg: #14221c;
  --side-ink: #dbe8e0;
  --side-ink-2: #8da396;
  --side-hover: rgba(255, 255, 255, 0.07);
  --side-active: rgba(255, 255, 255, 0.12);
  --side-mark: #5ad1b3;
  --band: var(--bg);
  --c1: #2a78d6;
  --c2: #eb6834;
  --c3: #1baf7a;
  --grid: #dde4db;
  --axis: #b9c4b9;
  --shadow: 0 1px 2px rgba(20, 34, 28, 0.06);
  --paper: #ffffff;
  --paper-ink: #17201b;
  --paper-ink-2: #55635a;
  --paper-line: #d5dcd3;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-serif: 'Newsreader', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411;
    --surface: #151d19;
    --surface-2: #1d2823;
    --line: #2b3831;
    --line-soft: #222e28;
    --ink: #e6ede8;
    --ink-2: #aebdb4;
    --ink-3: #8a9b92;
    --accent: #4cc2a6;
    --accent-ink: #05211b;
    --accent-soft: #1b3a33;
    --neg: #ff9086;
    --pos: #62d28c;
    --warn: #e5b04a;
    --warn-bg: #3a2e12;
    --bad-bg: #44211e;
    --ok-bg: #173a27;
    --side-bg: #0a100d;
    --side-hover: rgba(255, 255, 255, 0.06);
    --side-active: rgba(255, 255, 255, 0.1);
    --c1: #3987e5;
    --c2: #d95926;
    --c3: #199e70;
    --grid: #25312b;
    --axis: #33423a;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411;
  --surface: #151d19;
  --surface-2: #1d2823;
  --line: #2b3831;
  --line-soft: #222e28;
  --ink: #e6ede8;
  --ink-2: #aebdb4;
  --ink-3: #8a9b92;
  --accent: #4cc2a6;
  --accent-ink: #05211b;
  --accent-soft: #1b3a33;
  --neg: #ff9086;
  --pos: #62d28c;
  --warn: #e5b04a;
  --warn-bg: #3a2e12;
  --bad-bg: #44211e;
  --ok-bg: #173a27;
  --side-bg: #0a100d;
  --side-hover: rgba(255, 255, 255, 0.06);
  --side-active: rgba(255, 255, 255, 0.1);
  --c1: #3987e5;
  --c2: #d95926;
  --c3: #199e70;
  --grid: #25312b;
  --axis: #33423a;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .t td.n, .t th.r { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-3); }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Kerangka ===== */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side-bg); color: var(--side-ink); }
.side-in {
  position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 20px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px;
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: 4px; }
.brand-mark { width: 34px; height: 34px; flex: none; border-radius: 6px; background: var(--side-mark); color: #0b2a22; display: grid; place-items: center; }
.brand-t { font-weight: 600; font-size: 15px; line-height: 1.15; }
.brand-s { font-size: 11.5px; color: var(--side-ink-2); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--side-ink-2);
  padding: 9px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13.5px; position: relative;
}
.nav button:hover { background: var(--side-hover); color: var(--side-ink); }
.nav button[aria-current="page"] { background: var(--side-active); color: #fff; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--side-mark); }
.nav svg { flex: none; }
.nav-sep { height: 1px; background: rgba(255, 255, 255, 0.09); margin: 6px 4px; }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--side-ink-2); line-height: 1.5; padding-right: 6px; }
.status { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--side-mark); flex: none; }
.dot.warn { background: #e5b04a; }

.main { min-width: 0; }
.main-in { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; max-width: 1240px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-block: 20px 14px; }
.top h1 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
.top .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 879px) {
  :root { --band: var(--side-bg); }
  .app { display: block; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; }
  .side-in { position: static; max-height: none; overflow: visible; padding-block: 8px 0; padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px)); gap: 6px; flex-direction: row; align-items: center; }
  .brand { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 2px; padding-bottom: 8px; scrollbar-width: none; flex: 1; min-width: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { width: auto; white-space: nowrap; padding: 8px 11px; }
  .nav button[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: -1px; height: 3px; width: auto; border-radius: 3px 3px 0 0; }
  .nav-sep, .side-foot { display: none; }
  .top { padding-block: 16px 12px; }
  .top h1 { font-size: 20px; }
}

/* ===== Tombol & kolom isian ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 13.5px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.pri:hover { filter: brightness(0.93); }
.btn.bahaya { color: var(--neg); }
.btn.bahaya.yakin { background: var(--neg); color: var(--surface); border-color: transparent; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.in {
  width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; min-width: 0;
}
textarea.in { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select.in { padding-right: 6px; }
.in:hover { border-color: var(--axis); }
.in.num-in { text-align: right; font-variant-numeric: tabular-nums; }
.in.sm { height: 30px; font-size: 13px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.hint { font-size: 12px; color: var(--ink-3); }
.hint.ok { color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.grid2 .span2 { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 14px; height: 32px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 9px 14px; font-weight: 500; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 14px; }
.bar .grow { flex: 1 1 200px; min-width: 0; }
.bar .in { width: auto; }
.bar .in.grow { width: 100%; }

/* ===== Panel, ubin, chip ===== */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 14px; font-weight: 600; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-h .sub { font-size: 12.5px; color: var(--ink-3); }
.cols { display: grid; gap: 14px; margin-bottom: 14px; }
.cols.c2 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.cols.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols.ce { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1060px) { .cols.c2, .cols.c3, .cols.ce { grid-template-columns: minmax(0, 1fr); } .cols.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cols.c4 { grid-template-columns: minmax(0, 1fr); } }
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
@media (max-width: 1180px) { .hero { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hero .tile.big { grid-column: 1 / -1; } }
@media (max-width: 760px) { .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero .tile:last-child { grid-column: 1 / -1; } }
@media (max-width: 520px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .tile:last-child { grid-column: auto; } }
.t.kasb td:nth-child(2) { min-width: 220px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--shadow); }
.tile .k { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile .v .cur { font-size: 0.6em; font-weight: 500; color: var(--ink-3); margin-right: 5px; letter-spacing: 0; }
.tile.big .v .cur { color: var(--side-ink-2); }
.tile.big { background: var(--side-bg); color: var(--side-ink); border-color: transparent; }
.tile.big .k { color: var(--side-ink-2); }
.tile.big .v { font-size: 32px; color: #fff; }
.tile.big .d { color: var(--side-ink-2); }
.tile .d { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--pos); }
.chip.bad { background: var(--bad-bg); color: var(--neg); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.tile.big .chip { background: rgba(255, 255, 255, 0.12); color: #fff; }
.tile.big .chip.ok { background: rgba(98, 210, 140, 0.2); color: #8be6ad; }
.tile.big .chip.bad { background: rgba(255, 144, 134, 0.2); color: #ffb2aa; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.note { font-size: 12.5px; color: var(--ink-3); }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--line); margin-bottom: 14px; font-size: 13px; }
.banner.info { background: var(--accent-soft); }
.banner b { font-weight: 600; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* ===== Grafik ===== */
.cx { position: relative; width: 100%; touch-action: pan-y; }
.cx svg { display: block; overflow: visible; }
.cx-t { fill: var(--ink-3); font: 10.5px var(--font-sans); font-variant-numeric: tabular-nums; }
.cx-v { fill: var(--ink); font: 600 11.5px var(--font-sans); font-variant-numeric: tabular-nums; }
.cx-grid { stroke: var(--grid); stroke-width: 1; }
.cx-axis { stroke: var(--axis); stroke-width: 1; }
.cx-hl { fill: var(--surface-2); opacity: 0.7; }
.cx-cross { stroke: var(--axis); stroke-width: 1; }
.cx-ring { stroke: var(--surface); stroke-width: 2; }
.cx-dot { stroke: var(--surface); stroke-width: 2; }
.cx-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14); min-width: 150px; }
.cx-tip .th { font-weight: 600; margin-bottom: 4px; }
.cx-tip .tr { display: flex; justify-content: space-between; gap: 14px; align-items: center; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cx-tip .tr i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.cx-tip .tr b { color: var(--ink); font-weight: 600; }
.bh { display: flex; flex-direction: column; gap: 11px; }
.bh-r { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.bh-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.bh-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); min-width: 0; }
.bh-trk { height: 8px; }
.bh-bar { height: 8px; border-radius: 0 4px 4px 0; }
.bh-v { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.bh-v span { color: var(--ink-3); font-weight: 400; margin-left: 8px; font-size: 12px; }
.lst { display: flex; flex-direction: column; }
.lst-r { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.lst-r:last-child { border-bottom: 0; padding-bottom: 0; }
.lst-r .l { min-width: 0; }
.lst-r .l1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lst-r .l2 { font-size: 12px; color: var(--ink-3); }
.lst-r .r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.cek { display: flex; flex-direction: column; gap: 10px; }
.cek-r { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 13px; align-items: start; }
.cek-r small { display: block; color: var(--ink-3); font-size: 12px; }
.ic { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; margin-top: 1px; }
.ic.ok { background: var(--ok-bg); color: var(--pos); }
.ic.warn { background: var(--warn-bg); color: var(--warn); }
.ic.bad { background: var(--bad-bg); color: var(--neg); }

/* ===== Tabel ===== */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.t th { text-align: left; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.t tbody tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t td.n { white-space: nowrap; text-align: right; }
.t tr.klik { cursor: pointer; }
.t tr.klik:hover td { background: var(--surface-2); }
.t .k1 { font-weight: 500; }
.t .k2 { font-size: 12px; color: var(--ink-3); }
.t .kode { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); margin-right: 8px; white-space: nowrap; }
.st td:first-child { min-width: 210px; }
.t td.sticky, .t th.sticky { min-width: 104px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.t th.sticky { background: var(--surface-2); }
.t tr.redup td { color: var(--ink-3); }
.t tr.tot-r td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line); }
.t tr.tot-r td.sticky { background: var(--surface-2); }
.t .minggu td { background: var(--surface-2); }
.t.rapat th, .t.rapat td { padding-inline: 9px; }
/* laporan */
.st td { padding-block: 6px; }
.st tr.h td { background: var(--surface-2); font-weight: 600; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); padding-block: 8px; }
.st tr.sub td { font-weight: 600; padding-top: 12px; color: var(--ink); }
.st tr.a td:first-child { padding-left: 26px; }
.st tr.kosong td { padding-left: 26px; color: var(--ink-3); font-style: italic; }
.st tr.tot td { font-weight: 600; border-top: 1px solid var(--axis); }
.st tr.tot td:first-child { padding-left: 12px; }
.st tr.grand td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--axis); }

<script>
/* ===== core.js ===== */
/* ================= Utilitas ================= */
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad2 = n => String(n).padStart(2, '0');
const fmtN = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const fmtD1 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < -0.5 ? '-' : '') + 'Rp ' + fmtN.format(Math.abs(Math.round(n)));
const angka = n => { const v = Math.round(n); return v < 0 ? '(' + fmtN.format(-v) + ')' : fmtN.format(v); };
const angkaStrip = n => (Math.abs(n) < 0.5 ? '–' : angka(n));
const pct = (x, d) => (isFinite(x) ? (d === 0 ? fmtN.format(Math.round(x * 100)) : fmtD1.format(x * 100)) + '%' : '–');
function kompak(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  const f = (x, u) => s + String(+x.toFixed(1)).replace('.', ',') + ' ' + u;
  if (a >= 1e12) return f(a / 1e12, 'T');
  if (a >= 1e9) return f(a / 1e9, 'M');
  if (a >= 1e6) return f(a / 1e6, 'jt');
  if (a >= 1e3) return f(a / 1e3, 'rb');
  return s + Math.round(a);
}
const rpK = n => (n < 0 ? '-' : '') + 'Rp ' + kompak(Math.abs(n));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const hariIni = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const ymIni = () => hariIni().slice(0, 7);
const tglFmt = t => { if (!t) return ''; const p = t.split('-'); return (+p[2]) + ' ' + BLN[+p[1] - 1] + ' ' + p[0]; };
const tglPanjang = t => { const p = t.split('-'); return (+p[2]) + ' ' + BULAN[+p[1] - 1] + ' ' + p[0]; };
const ymFmt = ym => BULAN[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4);
const addYm = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad2(m + 1); };
const hariTerakhir = ym => new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate();
const tglValid = t => /^\d{4}-\d{2}-\d{2}$/.test(t) && !isNaN(Date.parse(t));

/* ================= Bagan akun ================= */
const TIPE = {

  ekuitas:           { label: 'Ekuitas',                    normal: 'K', grup: 'Ekuitas' },
  pendapatan:        { label: 'Pendapatan Usaha',           normal: 'K', grup: 'Laba Rugi' },
  hpp:               { label: 'Harga Pokok Penjualan',      normal: 'D', grup: 'Laba Rugi' },
  beban:             { label: 'Beban Operasional',          normal: 'D', grup: 'Laba Rugi' },
  pendapatan_lain:   { label: 'Pendapatan Lain-lain',       normal: 'K', grup: 'Laba Rugi' },
  beban_lain:        { label: 'Beban Lain-lain',            normal: 'D', grup: 'Laba Rugi' },
  pajak:             { label: 'Beban Pajak Penghasilan',    normal: 'D', grup: 'Laba Rugi' },
};
const TIPE_NERACA = ['aset_lancar', 'aset_tetap', 'kewajiban_pendek', 'kewajiban_panjang', 'ekuitas'];

const DEFAULT_AKUN = [
  ['1-1100', 'Kas', 'aset_lancar', { kas: true }],
  ['1-1210', 'Bank BCA', 'aset_lancar', { kas: true }],
  ['1-1220', 'Bank Mandiri', 'aset_lancar', { kas: true }],
  ['1-1300', 'Piutang Usaha', 'aset_lancar'],
  ['1-1400', 'Persediaan Barang', 'aset_lancar'],
  ['1-1500', 'Biaya Dibayar di Muka', 'aset_lancar'],
  ['1-1600', 'Pajak Dibayar di Muka', 'aset_lancar'],
  ['1-2100', 'Tanah & Bangunan', 'aset_tetap'],
  ['1-2200', 'Kendaraan', 'aset_tetap'],
  ['1-2300', 'Peralatan & Inventaris', 'aset_tetap'],
  ['1-2900', 'Akumulasi Penyusutan', 'aset_tetap', { normal: 'K' }],
  ['2-1100', 'Utang Usaha', 'kewajiban_pendek'],
  ['2-1200', 'Utang Gaji & Upah', 'kewajiban_pendek'],
  ['2-1300', 'Utang Pajak', 'kewajiban_pendek'],
  ['2-1400', 'Pendapatan Diterima di Muka', 'kewajiban_pendek'],
  ['2-1500', 'Utang Bank Jangka Pendek', 'kewajiban_pendek', { arus: 'pendanaan' }],
  ['2-2100', 'Utang Bank Jangka Panjang', 'kewajiban_panjang'],
  ['3-1000', 'Modal Disetor', 'ekuitas'],
  ['3-2000', 'Laba Ditahan', 'ekuitas'],
  ['3-3000', 'Prive / Dividen', 'ekuitas', { normal: 'D' }],
  ['4-1000', 'Penjualan Barang', 'pendapatan'],
  ['4-2000', 'Pendapatan Jasa', 'pendapatan'],
  ['4-3000', 'Retur & Potongan Penjualan', 'pendapatan', { normal: 'D' }],
  ['5-1000', 'Pembelian / HPP Barang Dagang', 'hpp'],
  ['5-2000', 'Biaya Angkut Pembelian', 'hpp'],
  ['6-1100', 'Gaji & Tunjangan Karyawan', 'beban'],
  ['6-1200', 'Sewa Kantor & Gudang', 'beban'],
  ['6-1300', 'Listrik, Air & Internet', 'beban'],
  ['6-1400', 'Pemasaran & Iklan', 'beban'],
  ['6-1500', 'Transportasi & BBM', 'beban'],
  ['6-1600', 'Perlengkapan Kantor', 'beban'],
  ['6-1700', 'Penyusutan Aset Tetap', 'beban'],
  ['6-1800', 'Administrasi & Biaya Bank', 'beban'],
  ['6-1900', 'Perbaikan & Pemeliharaan', 'beban'],
  ['6-2000', 'Beban Operasional Lainnya', 'beban'],
  ['7-1000', 'Pendapatan Bunga', 'pendapatan_lain'],
  ['7-2000', 'Pendapatan Lain-lain', 'pendapatan_lain'],
  ['8-1000', 'Beban Bunga Pinjaman', 'beban_lain'],
  ['8-2000', 'Beban Lain-lain', 'beban_lain'],
  ['9-1000', 'Pajak Penghasilan (PPh Final)', 'pajak'],
];
const akunDefault = () => DEFAULT_AKUN.map(r => Object.assign({ kode: r[0], nama: r[1], tipe: r[2] }, r[3] || {}));

const DEFAULT_ATURAN = [
  { kata: 'PLN|LISTRIK|PDAM|INTERNET|INDIHOME|WIFI', akun: '6-1300', arah: 'keluar' },
  { kata: 'GAJI|PAYROLL|UPAH|THR', akun: '6-1100', arah: 'keluar' },
  { kata: 'SEWA|KONTRAKAN', akun: '6-1200', arah: 'keluar' },
  { kata: 'IKLAN|ADS|INSTAGRAM|FACEBOOK|BROSUR|SPANDUK', akun: '6-1400', arah: 'keluar' },
  { kata: 'BBM|PERTAMINA|BENSIN|TOL|PARKIR|GRAB|GOJEK', akun: '6-1500', arah: 'keluar' },
  { kata: 'ATK|ALAT TULIS|KERTAS|FOTOKOPI', akun: '6-1600', arah: 'keluar' },
  { kata: 'BIAYA ADM|ADMIN BANK|BIAYA BULANAN|BIAYA KARTU', akun: '6-1800', arah: 'keluar' },
  { kata: 'BUNGA PINJAMAN|BUNGA KREDIT', akun: '8-1000', arah: 'keluar' },
  { kata: 'ANGSURAN|CICILAN', akun: '2-2100', arah: 'keluar' },
  { kata: 'PPH|PAJAK|DJP', akun: '9-1000', arah: 'keluar' },
  { kata: 'BENGKEL|SERVIS KENDARAAN|PERBAIKAN', akun: '6-1900', arah: 'keluar' },
  { kata: 'PEMBELIAN|SUPPLIER|PEMASOK', akun: '5-1000', arah: 'keluar' },
  { kata: 'BUNGA|JASA GIRO', akun: '7-1000', arah: 'masuk' },
  { kata: 'JASA|INSTALASI|MAINTENANCE', akun: '4-2000', arah: 'masuk' },
  { kata: 'PENJUALAN|INV|INVOICE', akun: '4-1000', arah: 'masuk' },
  { kata: 'PELUNASAN PIUTANG', akun: '1-1300', arah: 'masuk' },
];

function arusAkun(a) {
  if (!a) return 'operasi';
  if (a.arus) return a.arus;
  if (a.tipe === 'aset_tetap') return 'investasi';
  if (a.tipe === 'kewajiban_panjang' || a.tipe === 'ekuitas') return 'pendanaan';
  return 'operasi';
}

function configBaru(nama, tahun) {
  return {
    v: 1,
    perusahaan: {
      nama: nama || 'Perusahaan Saya', bentuk: 'PT', bidang: '', alamat: '', kota: '', npwp: '',
      direktur: '', jabatanDirektur: 'Direktur Utama', keuangan: '', jabatanKeuangan: 'Manajer Keuangan',
    },
    akun: akunDefault(),
    saldoAwal: { tgl: (tahun || new Date().getFullYear()) + '-01-01', nilai: {} },
    aturan: clone(DEFAULT_ATURAN),
    laporan: {},
    demo: false,
  };
}

/* ================= Model akuntansi =================
   S = { config, months: { 'YYYY-MM': { tx: [], jr: [] } } }
   tx = { id, tgl, jenis: masuk|keluar|transfer, akun (kas/bank sumber), lawan, ket, jml, ref }
   jr = { id, tgl, ket, ref, baris: [{akun, d, k}] }                                   */
const ketTx = (t, am) => t.ket || (t.jenis === 'transfer' ? 'Transfer ke ' : t.jenis === 'masuk' ? 'Uang masuk dari ' : 'Uang keluar untuk ') + ((am[t.lawan] || {}).nama || t.lawan || '-');
function txBaris(t) {
  const j = Math.round(t.jml);
  if (t.jenis === 'masuk') return [{ akun: t.akun, d: j, k: 0 }, { akun: t.lawan, d: 0, k: j }];
  if (t.jenis === 'keluar') return [{ akun: t.lawan, d: j, k: 0 }, { akun: t.akun, d: 0, k: j }];
  return [{ akun: t.lawan, d: j, k: 0 }, { akun: t.akun, d: 0, k: j }];
}

function buatModel(S) {
  const cfg = S.config;
  const akun = cfg.akun || [];
  const am = {};
  akun.forEach(a => { am[a.kode] = a; });
  const normalD = a => (a ? (a.normal ? a.normal === 'D' : TIPE[a.tipe].normal === 'D') : true);
  const kasAkun = akun.filter(a => a.kas);
  const kasSet = new Set(kasAkun.map(a => a.kode));
  const nilai = (kode, d, k) => (normalD(am[kode]) ? d - k : k - d);

  const J = [];
  const txAll = [], txById = {}, jrById = {};
  const sa = cfg.saldoAwal || { tgl: null, nilai: {} };
  if (sa.tgl) {
    const baris = [];
    Object.keys(sa.nilai || {}).forEach(kode => {
      const a = am[kode], v = sa.nilai[kode];
      if (!a || !v) return;
      const sisiD = normalD(a) ? v > 0 : v < 0;
      baris.push({ akun: kode, d: sisiD ? Math.abs(v) : 0, k: sisiD ? 0 : Math.abs(v) });
    });
    if (baris.length) J.push({ id: 'saldo-awal', tgl: sa.tgl, ket: 'Saldo awal', ref: 'SA', sumber: 'saldo', baris });
  }
  Object.keys(S.months).sort().forEach(ym => {
    const m = S.months[ym];
    (m.tx || []).forEach(t => {
      txAll.push(t); txById[t.id] = t;
      J.push({ id: t.id, tgl: t.tgl, ket: ketTx(t, am), ref: t.ref, sumber: 'kas', jenis: t.jenis, baris: txBaris(t) });
    });
    (m.jr || []).forEach(j => {
      jrById[j.id] = j;
      J.push({ id: j.id, tgl: j.tgl, ket: j.ket, ref: j.ref, sumber: 'manual', baris: j.baris });
    });
  });
  J.forEach((j, i) => { j._i = i; });
  J.sort((a, b) => (a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : a._i - b._i));
  const jIdx = {};
  J.forEach((j, i) => { jIdx[j.id] = i; });

  const post = [], by = {}, bln = {};
  J.forEach(j => j.baris.forEach(b => {
    const p = { tgl: j.tgl, ym: j.tgl.slice(0, 7), akun: b.akun, d: b.d || 0, k: b.k || 0, jid: j.id, ket: j.ket, ref: j.ref, sumber: j.sumber };
    post.push(p);
    (by[b.akun] = by[b.akun] || []).push(p);
    const bk = (bln[b.akun] = bln[b.akun] || {});
    const e = (bk[p.ym] = bk[p.ym] || { d: 0, k: 0 });
    e.d += p.d; e.k += p.k;
  }));

  function mut(kode, a, b) {
    const bk = bln[kode]; if (!bk) return 0;
    let d = 0, k = 0;
    for (const ym in bk) if (ym >= a && ym <= b) { d += bk[ym].d; k += bk[ym].k; }
    return nilai(kode, d, k);
  }
  // mutasi menurut arah alami seksi laporan (akun kontra bernilai negatif)
  function mutT(kode, a, b) {
    const x = am[kode], bk = bln[kode]; if (!x || !bk) return 0;
    let d = 0, k = 0;
    for (const ym in bk) if (ym >= a && ym <= b) { d += bk[ym].d; k += bk[ym].k; }
    return TIPE[x.tipe].normal === 'D' ? d - k : k - d;
  }
  const saldoSd = (kode, b) => mut(kode, '0000-00', b);
  const sumTipe = (tipe, a, b) => akun.reduce((s, x) => s + (x.tipe === tipe ? mutT(x.kode, a, b) : 0), 0);
  function lr(a, b) {
    const pend = sumTipe('pendapatan', a, b), hpp = sumTipe('hpp', a, b), beban = sumTipe('beban', a, b);
    const pl = sumTipe('pendapatan_lain', a, b), bl = sumTipe('beban_lain', a, b), pajak = sumTipe('pajak', a, b);
    const kotor = pend - hpp, oper = kotor - beban, sbp = oper + pl - bl, bersih = sbp - pajak;
    return { pend, hpp, kotor, beban, oper, pl, bl, sbp, pajak, bersih, totalBeban: hpp + beban + bl + pajak };
  }
  const saldoKas = ym => kasAkun.reduce((s, a) => s + saldoSd(a.kode, ym), 0);
  let openKas = 0;
  const openYm = sa.tgl ? sa.tgl.slice(0, 7) : null;
  post.forEach(p => { if (p.jid === 'saldo-awal' && kasSet.has(p.akun)) openKas += nilai(p.akun, p.d, p.k); });
  const saldoAwalKas = (a, b) => saldoKas(addYm(a, -1)) + (openYm && openYm >= a && openYm <= b ? openKas : 0);

  // Buku kas: setiap posting pada akun kas/bank + saldo berjalan
  function bukuKas() {
    const rows = [];
    kasAkun.forEach(a => {
      let saldo = 0;
      (by[a.kode] || []).forEach(p => {
        saldo += nilai(a.kode, p.d, p.k);
        const t = txById[p.jid];
        let lawan = '';
        if (t) lawan = p.akun === t.akun ? t.lawan : t.akun;
        rows.push({ tgl: p.tgl, jid: p.jid, akun: a.kode, masuk: p.d, keluar: p.k, saldo, ket: p.ket, ref: p.ref, lawan, tx: t || null, jenis: t ? t.jenis : 'saldo' });
      });
    });
    return rows;
  }

  const adaDataTahun = th => post.some(p => p.ym.slice(0, 4) === String(th) && p.jid !== 'saldo-awal');

  return { cfg, akun, am, normalD, kasAkun, kasSet, J, jIdx, post, by, bln, txAll, txById, jrById, nilai, mut, mutT, saldoSd, lr, saldoKas, saldoAwalKas, bukuKas, openKas, openYm, adaDataTahun };
}

/* ================= Laporan (garis-garis) =================
   Tiap laporan menghasilkan daftar baris:
   {t:'h'|'sub'|'a'|'tot'|'grand'|'final'|'pct'|'cek'|'kosong', text, kode, v:[...]}                */
function lrLines(M, cols) {
  const L = [];
  const tot = cols.map(c => M.lr(c.a, c.b));
  const sec = (judul, tipe, key, opsional) => {
    const rows = M.akun.filter(x => x.tipe === tipe)
      .map(x => ({ x, v: cols.map(c => M.mutT(x.kode, c.a, c.b)) }))
      .filter(r => r.v.some(v => Math.abs(v) > 0.5));
    if (opsional && !rows.length) return;
    L.push({ t: 'h', text: judul });
    rows.forEach(r => L.push({ t: 'a', kode: r.x.kode, text: r.x.nama, v: r.v }));
    if (!rows.length) L.push({ t: 'kosong', text: 'Belum ada transaksi' });
    L.push({ t: 'tot', text: 'Total ' + judul, v: tot.map(t => t[key]) });
  };
  sec('Pendapatan Usaha', 'pendapatan', 'pend');
  sec('Harga Pokok Penjualan', 'hpp', 'hpp');
  L.push({ t: 'grand', text: 'Laba Kotor', v: tot.map(t => t.kotor) });
  sec('Beban Operasional', 'beban', 'beban');
  L.push({ t: 'grand', text: 'Laba Operasional', v: tot.map(t => t.oper) });
  sec('Pendapatan Lain-lain', 'pendapatan_lain', 'pl', true);
  sec('Beban Lain-lain', 'beban_lain', 'bl', true);
  L.push({ t: 'grand', text: 'Laba Sebelum Pajak', v: tot.map(t => t.sbp) });
  sec('Beban Pajak Penghasilan', 'pajak', 'pajak', true);
  L.push({ t: 'final', text: 'Laba Bersih', v: tot.map(t => t.bersih) });
  L.push({ t: 'pct', text: 'Margin laba kotor', v: tot.map(t => (t.pend ? t.kotor / t.pend : NaN)) });
  L.push({ t: 'pct', text: 'Margin laba bersih', v: tot.map(t => (t.pend ? t.bersih / t.pend : NaN)) });
  return { lines: L, tot };
}

function nrcData(M, ym) {
  const th = +ym.slice(0, 4);
  const alami = { aset_lancar: 'D', aset_tetap: 'D', kewajiban_pendek: 'K', kewajiban_panjang: 'K', ekuitas: 'K' };
  const grp = {};
  TIPE_NERACA.forEach(tipe => {
    grp[tipe] = M.akun.filter(x => x.tipe === tipe).map(x => ({
      kode: x.kode, nama: x.nama,
      v: (M.normalD(x) === (alami[tipe] === 'D') ? 1 : -1) * M.saldoSd(x.kode, ym),
    }));
  });
  const lbLalu = M.lr('0000-00', (th - 1) + '-12').bersih;
  const lbIni = M.lr(th + '-01', ym).bersih;
  const sum = a => a.reduce((s, r) => s + r.v, 0);
  const t = { lancar: sum(grp.aset_lancar), tetap: sum(grp.aset_tetap), kp: sum(grp.kewajiban_pendek), kj: sum(grp.kewajiban_panjang), ekAkun: sum(grp.ekuitas), lbLalu, lbIni };
  t.aset = t.lancar + t.tetap; t.kew = t.kp + t.kj; t.ek = t.ekAkun + lbLalu + lbIni;
  t.selisih = t.aset - (t.kew + t.ek);
  return { grp, t };
}

function nrcLines(M, cols) {
  const D = cols.map(c => nrcData(M, c.ym));
  const L = [];
  const sec = (judul, tipe, key) => {
    const kodes = M.akun.filter(x => x.tipe === tipe).map(x => x.kode)
      .filter(k => D.some(d => Math.abs(d.grp[tipe].find(r => r.kode === k).v) > 0.5));
    L.push({ t: 'sub', text: judul });
    kodes.forEach(k => {
      const nama = M.am[k].nama;
      L.push({ t: 'a', kode: k, text: nama, v: D.map(d => d.grp[tipe].find(r => r.kode === k).v) });
    });
    if (!kodes.length) L.push({ t: 'kosong', text: 'Tidak ada saldo' });
    return kodes.length;
  };
  L.push({ t: 'h', text: 'ASET' });
  sec('Aset Lancar', 'aset_lancar'); L.push({ t: 'tot', text: 'Total Aset Lancar', v: D.map(d => d.t.lancar) });
  sec('Aset Tetap', 'aset_tetap'); L.push({ t: 'tot', text: 'Total Aset Tetap', v: D.map(d => d.t.tetap) });
  L.push({ t: 'grand', text: 'TOTAL ASET', v: D.map(d => d.t.aset) });
  L.push({ t: 'h', text: 'KEWAJIBAN' });
  sec('Kewajiban Jangka Pendek', 'kewajiban_pendek'); L.push({ t: 'tot', text: 'Total Kewajiban Jangka Pendek', v: D.map(d => d.t.kp) });
  sec('Kewajiban Jangka Panjang', 'kewajiban_panjang'); L.push({ t: 'tot', text: 'Total Kewajiban Jangka Panjang', v: D.map(d => d.t.kj) });
  L.push({ t: 'grand', text: 'TOTAL KEWAJIBAN', v: D.map(d => d.t.kew) });
  L.push({ t: 'h', text: 'EKUITAS' });
  sec('Modal & Saldo Ekuitas', 'ekuitas');
  if (D.some(d => Math.abs(d.t.lbLalu) > 0.5)) L.push({ t: 'a', kode: '', text: 'Laba Tahun-Tahun Sebelumnya', v: D.map(d => d.t.lbLalu) });
  L.push({ t: 'a', kode: '', text: 'Laba Tahun Berjalan', v: D.map(d => d.t.lbIni) });
  L.push({ t: 'grand', text: 'TOTAL EKUITAS', v: D.map(d => d.t.ek) });
  L.push({ t: 'final', text: 'TOTAL KEWAJIBAN & EKUITAS', v: D.map(d => d.t.kew + d.t.ek) });
  L.push({ t: 'cek', text: 'Selisih Aset – (Kewajiban + Ekuitas)', v: D.map(d => d.t.selisih) });
  return { lines: L, data: D };
}

function kasFlow(M, a, b) {
  const res = { operasi: {}, investasi: {}, pendanaan: {} };
  M.txAll.forEach(t => {
    const ym = t.tgl.slice(0, 7);
    if (ym < a || ym > b || t.jenis === 'transfer') return;
    const kls = arusAkun(M.am[t.lawan]);
    res[kls][t.lawan] = (res[kls][t.lawan] || 0) + (t.jenis === 'masuk' ? 1 : -1) * t.jml;
  });
  return res;
}

function akLines(M, cols) {
  const F = cols.map(c => kasFlow(M, c.a, c.b));
  const L = [];
  const sumKls = {};
  const judul = { operasi: 'Aktivitas Operasi', investasi: 'Aktivitas Investasi', pendanaan: 'Aktivitas Pendanaan' };
  ['operasi', 'investasi', 'pendanaan'].forEach(kls => {
    L.push({ t: 'h', text: 'Arus Kas dari ' + judul[kls] });
    const kodes = M.akun.map(a => a.kode).filter(k => F.some(f => f[kls][k] != null && Math.abs(f[kls][k]) > 0.5));
    kodes.forEach(k => {
      const a = M.am[k];
      const semuaMasuk = F.every(f => (f[kls][k] || 0) >= 0), semuaKeluar = F.every(f => (f[kls][k] || 0) <= 0);
      L.push({ t: 'a', kode: k, text: (semuaMasuk ? 'Penerimaan: ' : semuaKeluar ? 'Pembayaran: ' : 'Neto: ') + a.nama, v: F.map(f => f[kls][k] || 0) });
    });
    if (!kodes.length) L.push({ t: 'kosong', text: 'Tidak ada transaksi' });
    sumKls[kls] = F.map(f => Object.keys(f[kls]).reduce((s, k) => s + f[kls][k], 0));
    L.push({ t: 'tot', text: 'Kas Bersih dari ' + judul[kls], v: sumKls[kls] });
  });
  const naik = cols.map((_, i) => sumKls.operasi[i] + sumKls.investasi[i] + sumKls.pendanaan[i]);
  const awal = cols.map(c => M.saldoAwalKas(c.a, c.b));
  const akhir = cols.map(c => M.saldoKas(c.b));
  L.push({ t: 'grand', text: 'Kenaikan (Penurunan) Kas Bersih', v: naik });
  L.push({ t: 'a', kode: '', text: 'Saldo Kas & Bank Awal Periode', v: awal });
  L.push({ t: 'final', text: 'Saldo Kas & Bank Akhir Periode', v: awal.map((x, i) => x + naik[i]) });
  L.push({ t: 'cek', text: 'Selisih dengan saldo buku', v: akhir.map((x, i) => x - (awal[i] + naik[i])) });
  return { lines: L, naik, awal, akhir, ops: sumKls };
}

function tbData(M, ym) {
  const th = +ym.slice(0, 4);
  const rows = [];
  M.akun.forEach(a => {
    const lrAkun = TIPE[a.tipe].grup === 'Laba Rugi';
    const v = lrAkun ? M.mut(a.kode, th + '-01', ym) : M.saldoSd(a.kode, ym);
    if (Math.abs(v) < 0.5) return;
    const nd = M.normalD(a);
    // v dalam sisi normal; ubah ke sisi debit/kredit
    const d = nd ? (v > 0 ? v : 0) : (v < 0 ? -v : 0);
    const k = nd ? (v < 0 ? -v : 0) : (v > 0 ? v : 0);
    rows.push({ kode: a.kode, nama: a.nama, d, k });
  });
  const lbLalu = M.lr('0000-00', (th - 1) + '-12').bersih;
  if (Math.abs(lbLalu) > 0.5) rows.push({ kode: '', nama: 'Laba Tahun-Tahun Sebelumnya', d: lbLalu < 0 ? -lbLalu : 0, k: lbLalu > 0 ? lbLalu : 0 });
  const td = rows.reduce((s, r) => s + r.d, 0), tk = rows.reduce((s, r) => s + r.k, 0);
  return { rows, td, tk };
}

function rekapTahun(M, th) {
  const rows = [];
  const tx = M.txAll;
  for (let m = 1; m <= 12; m++) {
    const ym = th + '-' + pad2(m);
    const t = M.lr(ym, ym);
    const delta = tx.filter(x => x.tgl.slice(0, 7) === ym);
    const kasMasuk = delta.filter(x => x.jenis === 'masuk').reduce((s, x) => s + x.jml, 0);
    const kasKeluar = delta.filter(x => x.jenis === 'keluar').reduce((s, x) => s + x.jml, 0);
    const njr = M.post.some(p => p.ym === ym && p.sumber === 'manual');
    rows.push(Object.assign({
      ym, m, ntx: delta.length, ada: delta.length > 0 || njr,
      margin: t.pend ? t.bersih / t.pend : NaN, kasMasuk, kasKeluar, kasNeto: kasMasuk - kasKeluar,
      saldoKas: M.saldoKas(ym), rek: M.kasAkun.map(a => M.saldoSd(a.kode, ym)),
    }, t));
  }
  const tot = M.lr(th + '-01', th + '-12');
  const total = Object.assign({
    ntx: rows.reduce((s, r) => s + r.ntx, 0), margin: tot.pend ? tot.bersih / tot.pend : NaN,
    kasMasuk: rows.reduce((s, r) => s + r.kasMasuk, 0), kasKeluar: rows.reduce((s, r) => s + r.kasKeluar, 0),
    saldoKas: rows[11].saldoKas,
  }, tot);
  total.kasNeto = total.kasMasuk - total.kasKeluar;
  return { rows, total };
}

// bulan terakhir yang dipakai untuk "sampai saat ini" pada tahun tertentu
function bulanAkhir(th) {
  const now = new Date();
  if (th < now.getFullYear()) return th + '-12';
  if (th > now.getFullYear()) return th + '-01';
  return th + '-' + pad2(now.getMonth() + 1);
}

/* ================= Ringkasan eksekutif otomatis ================= */
const tglAkhirYm = ym => tglPanjang(ym + '-' + pad2(hariTerakhir(ym)));
function ringkasanEksekutif(M, th, bAkhir) {
  const nama = (M.cfg.perusahaan.bentuk ? M.cfg.perusahaan.bentuk + ' ' : '') + M.cfg.perusahaan.nama;
  const a = th + '-01', b = bAkhir || th + '-12', bm = +b.slice(5), penuh = bm === 12;
  const pa = addYm(a, -12), pb = addYm(b, -12);
  const cur = M.lr(a, b), prev = M.lr(pa, pb);
  const adaPrev = M.adaDataTahun(th - 1);
  const rk = rekapTahun(M, th);
  const nrc = nrcData(M, b).t, nrcPrev = nrcData(M, pb).t;
  const out = [];
  const arah = (x, y) => (x >= y ? 'naik' : 'turun');
  const banding = penuh ? 'tahun ' + (th - 1) : 'periode yang sama tahun ' + (th - 1);
  let p1 = (penuh ? 'Sepanjang tahun ' + th : 'Pada periode Januari sampai ' + BULAN[bm - 1] + ' ' + th) + ', ' + nama + ' membukukan pendapatan usaha sebesar ' + rp(cur.pend);
  if (adaPrev && prev.pend > 0) {
    const g = (cur.pend - prev.pend) / prev.pend;
    p1 += ', ' + arah(cur.pend, prev.pend) + ' ' + pct(Math.abs(g)) + ' dibandingkan ' + banding + ' (' + rp(prev.pend) + ')';
  }
  out.push(p1 + '.');
  let p2 = 'Laba kotor tercatat ' + rp(cur.kotor) + (cur.pend ? ' (margin ' + pct(cur.kotor / cur.pend) + ')' : '') + ', sedangkan laba bersih setelah pajak mencapai ' + rp(cur.bersih) + (cur.pend ? ' atau ' + pct(cur.bersih / cur.pend) + ' dari pendapatan' : '');
  if (adaPrev && Math.abs(prev.bersih) > 0) p2 += '; ' + (cur.bersih >= prev.bersih ? 'meningkat' : 'menurun') + ' ' + pct(Math.abs((cur.bersih - prev.bersih) / Math.abs(prev.bersih))) + ' dari pembanding';
  out.push(p2 + '.');
  const aktif = rk.rows.filter(r => r.ada && r.ym <= b);
  if (aktif.length >= 3) {
    const hi = aktif.reduce((x, y) => (y.pend > x.pend ? y : x)), lo = aktif.reduce((x, y) => (y.pend < x.pend ? y : x));
    out.push('Pendapatan bulanan tertinggi terjadi pada bulan ' + BULAN[hi.m - 1] + ' (' + rp(hi.pend) + ') dan terendah pada bulan ' + BULAN[lo.m - 1] + ' (' + rp(lo.pend) + ').');
  }
  const bebanAkun = M.akun.filter(x => x.tipe === 'beban').map(x => ({ nama: x.nama, v: M.mutT(x.kode, a, b) })).sort((x, y) => y.v - x.v);
  if (bebanAkun.length && bebanAkun[0].v > 0 && cur.beban > 0) out.push('Pos beban operasional terbesar adalah ' + bebanAkun[0].nama + ' sebesar ' + rp(bebanAkun[0].v) + ' (' + pct(bebanAkun[0].v / cur.beban, 0) + ' dari total beban operasional).');
  const awalKas = M.saldoAwalKas(a, b), akhirKas = M.saldoKas(b);
  out.push('Saldo kas dan bank pada ' + tglAkhirYm(b) + ' adalah ' + rp(akhirKas) + ', ' + (akhirKas >= awalKas ? 'naik ' : 'turun ') + rp(Math.abs(akhirKas - awalKas)) + ' dibandingkan awal tahun.');
  let p5 = 'Pada posisi ' + tglAkhirYm(b) + ', total aset sebesar ' + rp(nrc.aset) + ', total kewajiban ' + rp(nrc.kew) + ' dan total ekuitas ' + rp(nrc.ek) + '.';
  if (nrc.ek > 0) p5 += ' Rasio kewajiban terhadap ekuitas sebesar ' + fmtD1.format(nrc.kew / nrc.ek) + ' kali.';
  out.push(p5);
  return {
    paragraf: out, cur, prev, adaPrev, rk, nrc, nrcPrev, awalKas, akhirKas, nama, b,
    kpi: [
      { label: 'Pendapatan Usaha', v: cur.pend, p: adaPrev ? prev.pend : null },
      { label: 'Laba Kotor', v: cur.kotor, p: adaPrev ? prev.kotor : null },
      { label: 'Laba Bersih', v: cur.bersih, p: adaPrev ? prev.bersih : null },
      { label: 'Saldo Kas & Bank', v: akhirKas, p: adaPrev ? awalKas : null },
    ],
  };
}

/* ================= Validasi & bantuan ================= */
function cocokAturan(aturan, ket, arah) {
  const teks = String(ket || '').toUpperCase();
  for (const r of aturan || []) {
    if (r.arah && r.arah !== arah) continue;
    const kata = String(r.kata || '').toUpperCase().split('|').map(s => s.trim()).filter(Boolean);
    if (kata.some(k => teks.includes(k))) return r;
  }
  return null;
}
function akunDipakai(S, kode) {
  for (const ym in S.months) {
    const m = S.months[ym];
    if ((m.tx || []).some(t => t.akun === kode || t.lawan === kode)) return true;
    if ((m.jr || []).some(j => j.baris.some(b => b.akun === kode))) return true;
  }
  const sa = S.config.saldoAwal;
  return !!(sa && sa.nilai && Math.abs(sa.nilai[kode] || 0) > 0);
}

      // peristiwa khusus

      if (y === 2025 && m === 6) tx(T(y, m, 9), 'masuk', '1-1210', '3-1000', 50e6, 'Setoran tambahan modal pemegang saham', 'SM-2506');

      // penyusutan
      const dep = y === 2025 ? (m < 4 ? 3.9e6 : m < 11 ? 4.2e6 : 4.5e6) : (m < 5 ? 4.5e6 : 6.4e6);
      jr(T(y, m, 31), 'Penyusutan aset tetap ' + BULAN[m - 1] + ' ' + y, 'PNY-' + kode, [{ akun: '6-1700', d: dep, k: 0 }, { akun: '1-2900', d: 0, k: dep }]);

      omzetPrev = omzet;
    }
  }
  return { config: cfg, months };
}


/* ===== store.js ===== */
/* ================= Penyimpanan =================
   Mode 'db'     : kapabilitas db milik artifact (tersimpan di server, ikut terbawa saat halaman diperbarui)
   Mode 'local'  : localStorage browser (cadangan jika db tidak tersedia)
   Mode 'memory' : tanpa penyimpanan permanen                                                       */
const Store = (() => {
  const S = { config: null, months: {} };
  let mode = 'memory', db = null, canWrite = true, ready = false, loadError = '';
  const subs = [];
  const dirty = {}, inflight = {};
  const LS_KEY = 'pembukuan.v1';
  let errHandler = () => {};
  const notify = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });

  const lsGet = () => { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
  const lsSet = () => { try { localStorage.setItem(LS_KEY, JSON.stringify({ config: S.config, months: S.months })); return true; } catch (e) { return false; } };
  const lsOk = () => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } };

  async function init() {
    let cap = null, user = null;
    try {
      if (window.claude && window.claude.use) {
        cap = await window.claude.use('db');
        try { user = await window.claude.use('user'); } catch (e) { user = null; }
      }
    } catch (e) { cap = null; }
    if (user && typeof user.can === 'function') {
      try { if ((await user.can('data.write')) === false) canWrite = false; } catch (e) { /* biarkan */ }
    }
    if (cap) { db = cap; mode = 'db'; await subscribe(); return; }
    mode = lsOk() ? 'local' : 'memory';
    const d = lsGet();
    if (d && d.config) { S.config = d.config; S.months = d.months || {}; }
    ready = true; notify();
  }

  function subscribe() {
    return new Promise(resolve => {
      const got = { config: false, bulan: false };
      const cek = () => { if (got.config && got.bulan && !ready) { ready = true; resolve(); } if (ready) notify(); };
      db.doc('config/main').onSnapshot(snap => {
        if (!(dirty.config || inflight.config)) S.config = snap.exists ? clone(snap.data()) : null;
        got.config = true; cek();
      }, e => { loadError = (e && e.message) || 'Gagal membaca data'; got.config = true; cek(); });
      db.collection('bulan').onSnapshot(qs => {
        const next = {};
        qs.docs.forEach(d => {
          const id = d.id;
          if ((dirty[id] || inflight[id]) && S.months[id]) { next[id] = S.months[id]; return; }
          const x = d.data() || {};
          next[id] = { tx: clone(x.tx || []), jr: clone(x.jr || []) };
        });
        Object.keys(S.months).forEach(id => { if ((dirty[id] || inflight[id]) && !next[id] && S.months[id]) next[id] = S.months[id]; });
        S.months = next; got.bulan = true; cek();
      }, e => { loadError = (e && e.message) || 'Gagal membaca data'; got.bulan = true; cek(); });
      setTimeout(() => { if (!ready) { ready = true; resolve(); notify(); } }, 8000);
    });
  }

  async function tulis(key) {
    if (key === 'config') return db.doc('config/main').set(S.config);
    const m = S.months[key];
    if (!m || (!(m.tx || []).length && !(m.jr || []).length)) return db.doc('bulan/' + key).delete();
    const body = { tx: m.tx || [], jr: m.jr || [] };
    if (JSON.stringify(body).length > 245000) throw new Error('Terlalu banyak transaksi pada bulan ' + key + '. Hapus yang tidak perlu atau pindahkan sebagian ke bulan lain.');
    return db.doc('bulan/' + key).set(body);
  }
  async function pump(key) {
    if (inflight[key]) return;
    inflight[key] = true;
    try { while (dirty[key]) { dirty[key] = false; await tulis(key); } }
    catch (e) { errHandler(e); }
    finally { inflight[key] = false; }
  }
  function persist(key) {
    if (mode === 'local') { if (!lsSet()) errHandler(new Error('Penyimpanan browser penuh atau dinonaktifkan. Unduh cadangan data Anda.')); return; }
    if (mode === 'db') { dirty[key] = true; pump(key); }
  }
  function bolehTulis() {
    if (!canWrite) { errHandler(new Error('Akses Anda hanya untuk melihat. Minta pemilik memberi akses ubah.')); return false; }
    return true;
  }

  const bucket = ym => (S.months[ym] = S.months[ym] || { tx: [], jr: [] });
  const cari = (id, jenis) => {
    for (const ym in S.months) {
      const i = (S.months[ym][jenis] || []).findIndex(t => t.id === id);
      if (i >= 0) return { ym, i };
    }
    return null;
  };
  function simpanItem(jenis, item) {
    const ym = item.tgl.slice(0, 7);
    const f = cari(item.id, jenis);
    if (f && f.ym === ym) { S.months[ym][jenis][f.i] = item; persist(ym); return; }
    if (f) { S.months[f.ym][jenis].splice(f.i, 1); persist(f.ym); }
    bucket(ym)[jenis].push(item); persist(ym);
  }
  function hapusItem(jenis, id) {
    const f = cari(id, jenis); if (!f) return;
    S.months[f.ym][jenis].splice(f.i, 1); persist(f.ym);
    const m = S.months[f.ym];
    if (!m.tx.length && !m.jr.length && mode !== 'db') delete S.months[f.ym];
  }

  return {
    S, init,
    get mode() { return mode; }, get ready() { return ready; }, get canWrite() { return canWrite; }, get loadError() { return loadError; },
    onChange: f => subs.push(f), onError: f => { errHandler = f; },
    simpanTx(t) { if (!bolehTulis()) return false; simpanItem('tx', t); notify(); return true; },
    hapusTx(id) { if (!bolehTulis()) return false; hapusItem('tx', id); notify(); return true; },
    simpanTxBanyak(list) { if (!bolehTulis()) return false; list.forEach(t => simpanItem('tx', t)); notify(); return true; },
    simpanJr(j) { if (!bolehTulis()) return false; simpanItem('jr', j); notify(); return true; },
    hapusJr(id) { if (!bolehTulis()) return false; hapusItem('jr', id); notify(); return true; },
    ubahConfig(fn) { if (!bolehTulis()) return false; fn(S.config); persist('config'); notify(); return true; },
    gantiSemua(cfg, months) {
      if (!bolehTulis()) return false;
      const keys = new Set(Object.keys(S.months).concat(Object.keys(months || {})));
      S.config = cfg; S.months = months || {};
      keys.forEach(k => persist(k)); persist('config'); notify();
      return true;
    },
    cadangan() { return { aplikasi: 'Pembukuan Perusahaan', versi: 1, dibuat: new Date().toISOString(), config: S.config, months: S.months }; },
  };
})();

/* ===== charts.js ===== */
/* ================= Grafik (SVG digambar sesuai lebar wadah) ================= */
const chartReg = [];
function bersihkanGrafik() { while (chartReg.length) { const o = chartReg.pop(); try { o.disconnect(); } catch (e) { /* abaikan */ } } }
function pasangGrafik(host, gambar) {
  let lebar = 0;
  const jalan = () => { const w = Math.round(host.clientWidth); if (w === lebar || w < 40) return; lebar = w; gambar(); };
  jalan();
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => jalan());
    ro.observe(host); chartReg.push(ro);
  }
}

function niceTicks(min, max, n) {
  if (max === min) max = min + 1;
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step + 1e-9) * step, hi = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toPrecision(12));
  return { lo, hi, ticks };
}
const sumbuLabel = v => (v === 0 ? '0' : kompak(v));

function barPath(x, y0, y1, w, r) {
  const h = Math.abs(y1 - y0);
  if (h < 0.5) return '';
  r = Math.min(r, h, w / 2);
  if (y1 < y0) return 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 + r) + 'V' + y0 + 'Z';
  return 'M' + x + ',' + y0 + 'V' + (y1 - r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 - r) + 'V' + y0 + 'Z';
}

function gridSumbu(sc, y, ml, W, mr) {
  let s = '';
  sc.ticks.forEach(t => {
    const yy = y(t).toFixed(1);
    s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + yy + '" y2="' + yy + '" class="' + (t === 0 ? 'cx-axis' : 'cx-grid') + '"/>';
    s += '<text x="' + (ml - 6) + '" y="' + yy + '" dy="3.5" text-anchor="end" class="cx-t">' + esc(sumbuLabel(t)) + '</text>';
  });
  return s;
}

function aktifkanHover(host, n, geom, isiTip) {
  const tip = host.querySelector('.cx-tip'), hl = host.querySelector('.cx-hl'), dots = host.querySelectorAll('.cx-dot');
  const svg = host.querySelector('svg');
  const pindah = e => {
    const rc = svg.getBoundingClientRect();
    const x = e.clientX - rc.left;
    let i = Math.floor((x - geom.ml) / geom.gw);
    if (i < 0 || i >= n || x < geom.ml - 4) { sembunyi(); return; }
    const cx = geom.ml + geom.gw * (i + 0.5);
    if (hl) { hl.setAttribute('x', geom.ml + geom.gw * i); hl.setAttribute('width', geom.gw); hl.style.display = ''; }
    if (geom.garis) { const g = host.querySelector('.cx-cross'); g.setAttribute('x1', cx); g.setAttribute('x2', cx); g.style.display = ''; }
    dots.forEach(d => { const v = geom.dotY && geom.dotY[i]; if (v == null) { d.style.display = 'none'; } else { d.setAttribute('cx', cx); d.setAttribute('cy', v); d.style.display = ''; } });
    tip.innerHTML = isiTip(i); tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = cx + 14; if (left + tw > host.clientWidth - 4) left = cx - tw - 14; if (left < 4) left = 4;
    tip.style.left = left + 'px'; tip.style.top = Math.max(2, Math.min(geom.mt + 6, host.clientHeight - th - 2)) + 'px';
  };
  const sembunyi = () => {
    tip.style.display = 'none'; if (hl) hl.style.display = 'none';
    const g = host.querySelector('.cx-cross'); if (g) g.style.display = 'none';
    dots.forEach(d => { d.style.display = 'none'; });
  };
  host.onpointermove = pindah; host.onpointerdown = pindah; host.onpointerleave = sembunyi;
}

// kolom berkelompok: o = {labels, series:[{nama, warna, v}], tinggi, tip(i) => html}
function gambarKolom(host, o) {
  const W = Math.max(280, Math.round(host.clientWidth)), H = o.tinggi || 240;
  const ml = 46, mr = 6, mt = 10, mb = 24, pw = W - ml - mr, ph = H - mt - mb;
  const all = o.series.reduce((a, s) => a.concat(s.v), []);
  const sc = niceTicks(Math.min(0, ...all), Math.max(0, ...all), 4);
  const y = v => mt + ph - ((v - sc.lo) / (sc.hi - sc.lo)) * ph;
  const n = o.labels.length, gw = pw / n, ns = o.series.length;
  const bw = Math.min(20, Math.max(4, (gw * 0.8 - (ns - 1) * 2) / ns));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.aria || '') + '">';
  s += gridSumbu(sc, y, ml, W, mr);
  s += '<rect class="cx-hl" x="0" y="' + mt + '" width="0" height="' + ph + '" style="display:none"/>';
  o.labels.forEach((lb, i) => {
    const cx = ml + gw * (i + 0.5);
    if (gw >= 26 || i % 2 === 0) s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" class="cx-t">' + esc(lb) + '</text>';
    const tw = ns * bw + (ns - 1) * 2;
    o.series.forEach((se, j) => {
      const x = cx - tw / 2 + j * (bw + 2);
      const p = barPath(+x.toFixed(1), +y(0).toFixed(1), +y(se.v[i]).toFixed(1), bw, 4);
      if (p) s += '<path d="' + p + '" style="fill:' + se.warna + '"/>';
    });
  });
  s += '</svg><div class="cx-tip" style="display:none"></div>';
  host.innerHTML = s;
  aktifkanHover(host, n, { ml, gw, mt }, o.tip);
}

// garis tunggal dengan area tipis: o = {labels, v:[number|null], warna, tinggi, tip(i), labelAkhir}
function gambarGaris(host, o) {
  const W = Math.max(280, Math.round(host.clientWidth)), H = o.tinggi || 220;
  const ml = 46, mr = 12, mt = 16, mb = 24, pw = W - ml - mr, ph = H - mt - mb;
  const vals = o.v.filter(v => v != null);
  const sc = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const y = v => mt + ph - ((v - sc.lo) / (sc.hi - sc.lo)) * ph;
  const n = o.labels.length, gw = pw / n;
  const px = i => ml + gw * (i + 0.5);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.aria || '') + '">';
  s += gridSumbu(sc, y, ml, W, mr);
  const idx = o.v.map((v, i) => (v == null ? -1 : i)).filter(i => i >= 0);
  if (idx.length) {
    const pts = idx.map(i => px(i).toFixed(1) + ',' + y(o.v[i]).toFixed(1));
    const garis = 'M' + pts.join('L');
    const area = garis + 'L' + px(idx[idx.length - 1]).toFixed(1) + ',' + y(0).toFixed(1) + 'L' + px(idx[0]).toFixed(1) + ',' + y(0).toFixed(1) + 'Z';
    s += '<path d="' + area + '" style="fill:' + o.warna + ';opacity:0.1"/>';
    s += '<path d="' + garis + '" style="fill:none;stroke:' + o.warna + ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
    const last = idx[idx.length - 1];
    s += '<circle cx="' + px(last).toFixed(1) + '" cy="' + y(o.v[last]).toFixed(1) + '" r="4" style="fill:' + o.warna + '" class="cx-ring"/>';
    if (o.labelAkhir) {
      const anchor = px(last) > W - 70 ? 'end' : 'start';
      const lx = anchor === 'end' ? px(last) - 2 : px(last) + 2;
      s += '<text x="' + lx.toFixed(1) + '" y="' + (y(o.v[last]) - 10).toFixed(1) + '" text-anchor="' + anchor + '" class="cx-v">' + esc(o.labelAkhir(o.v[last])) + '</text>';
    }
  }
  s += '<line class="cx-cross" x1="0" x2="0" y1="' + mt + '" y2="' + (mt + ph) + '" style="display:none"/>';
  s += '<circle class="cx-dot" r="4" style="display:none;fill:' + o.warna + '"/>';
  o.labels.forEach((lb, i) => {
    if (gw >= 26 || i % 2 === 0) s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" class="cx-t">' + esc(lb) + '</text>';
  });
  s += '</svg><div class="cx-tip" style="display:none"></div>';
  host.innerHTML = s;
  aktifkanHover(host, n, { ml, gw, mt, garis: true, dotY: o.v.map(v => (v == null ? null : y(v))) }, i => (o.v[i] == null ? '' : o.tip(i)));
}

function deltaChip(cur, prev, baikNaik, label) {
  if (prev == null || Math.abs(prev) < 0.5) return '<span class="chip">Belum ada pembanding</span>';

  const naik = g >= 0;

  if (Math.abs(g) < 0.0005) return '<span class="chip">Stabil ' + (label || '') + '</span>';
  return '<span class="chip ' + (baik ? 'ok' : 'bad') + '">' + (naik ? IC.naik : IC.turun) + ' ' + pct(Math.abs(g)) + '</span><span>' + esc(label || '') + '</span>';

  const sa = M.cfg.saldoAwal;

  out.push(adaSA ? it('ok', '✓', 'Saldo awal sudah diisi', 'Per ' + tglPanjang(sa.tgl) + '.') : it('warn', '!', 'Saldo awal belum diisi', 'Isi saldo kas, bank, piutang, dan utang awal agar neraca akurat.'));

/* ----- impor mutasi bank ----- */
const BULAN_ALIAS = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, agt: 8, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };
function parseTgl(s) {
  s = String(s || '').trim().replace(/^'/, '');
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})/))) return ok(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  if ((m = s.match(/^(\d{1,2})[-/. ]([A-Za-z]{3})[A-Za-z]*[-/. ](\d{2,4})/))) { const mo = BULAN_ALIAS[m[2].toLowerCase()]; return mo ? ok(+m[3] < 100 ? 2000 + +m[3] : +m[3], mo, +m[1]) : null; }
  return null;
  function ok(y, mo, d) { if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; return y + '-' + pad2(mo) + '-' + pad2(d); }
}
function parseAngka(s) {
  s = String(s == null ? '' : s).trim();
  if (!s) return 0;
  const neg = /^-|^\(.*\)$|-$/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  if (!s) return 0;
  const ld = s.lastIndexOf('.'), lc = s.lastIndexOf(',');
  if (ld >= 0 && lc >= 0) s = ld > lc ? s.replace(/,/g, '') : s.replace(/\./g, '').replace(',', '.');
  else if (lc >= 0) s = /,\d{1,2}$/.test(s) && s.indexOf(',') === lc ? s.replace(',', '.') : s.replace(/,/g, '');
  else if (ld >= 0) s = /\.\d{3}$/.test(s) || (s.match(/\./g) || []).length > 1 ? s.replace(/\./g, '') : s;
  const v = Math.abs(Math.round(parseFloat(s) || 0));
  return neg ? -v : v;
}
function pecahBaris(l, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < l.length; i++) {
    const c = l[i];
    if (c === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === d && !q) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
function parseMutasi(teks, akunBank) {
  const lines = String(teks || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  const cnt = d => lines.slice(0, 6).reduce((s, l) => s + (l.split(d).length - 1), 0);
  const delim = [';', '\t', ','].sort((a, b) => cnt(b) - cnt(a))[0];
  const tab = lines.map(l => pecahBaris(l, delim));
  let hi = tab.findIndex(r => r.some(c => /tanggal|tgl|date/i.test(c)) && r.some(c => /ket|desk|uraian|remark|berita|transaksi|descr|debit|kredit|debet|credit|jumlah|amount/i.test(c)));
  let kol = { tgl: 0, ket: 1, debit: 2, kredit: 3, jumlah: -1 };
  if (hi >= 0) {
    kol = { tgl: -1, ket: -1, debit: -1, kredit: -1, jumlah: -1 };
    tab[hi].forEach((c, i) => {
      const x = c.toLowerCase();
      if (kol.tgl < 0 && /tanggal|tgl|date/.test(x)) kol.tgl = i;
      else if (kol.ket < 0 && /keterangan|deskripsi|description|uraian|remark|berita|transaksi/.test(x)) kol.ket = i;
      else if (kol.debit < 0 && /^(debit|debet|db|dr|keluar)\b|debit|debet/.test(x)) kol.debit = i;
      else if (kol.kredit < 0 && /^(kredit|credit|cr|kr|masuk)\b|kredit|credit/.test(x)) kol.kredit = i;
      else if (kol.jumlah < 0 && /jumlah|amount|nominal|mutasi/.test(x)) kol.jumlah = i;
    });
    if (kol.ket < 0) kol.ket = tab[hi].findIndex((c, i) => i !== kol.tgl && i !== kol.debit && i !== kol.kredit && i !== kol.jumlah && !/saldo|balance/i.test(c));
  } else hi = -1;
  const adaDup = new Set(M.txAll.filter(t => t.akun === akunBank).map(t => t.tgl + '|' + t.jenis + '|' + Math.round(t.jml)));
  const out = [];
  tab.slice(hi + 1).forEach(r => {
    const tgl = parseTgl(r[kol.tgl]);
    if (!tgl) return;
    let jenis = '', jml = 0;
    if (kol.debit >= 0 || kol.kredit >= 0) {
      const d = kol.debit >= 0 ? Math.abs(parseAngka(r[kol.debit])) : 0, k = kol.kredit >= 0 ? Math.abs(parseAngka(r[kol.kredit])) : 0;
      if (k > 0 && d === 0) { jenis = 'masuk'; jml = k; } else if (d > 0 && k === 0) { jenis = 'keluar'; jml = d; } else if (k > 0 && d > 0) { jenis = k >= d ? 'masuk' : 'keluar'; jml = Math.abs(k - d); }
    } else if (kol.jumlah >= 0) {
      const raw = r[kol.jumlah] || '', v = parseAngka(raw);
      const keluar = /\bDB\b|\bD$|DEBIT/i.test(raw) || v < 0, masuk = /\bCR\b|\bK$|CREDIT|KREDIT/i.test(raw);
      jml = Math.abs(v); jenis = keluar && !masuk ? 'keluar' : 'masuk';
    }
    if (!jenis || !jml) return;
    const ket = (r[kol.ket] || '').replace(/\s+/g, ' ').trim();
    const rule = cocokAturan(M.cfg.aturan, ket, jenis);
    const lawan = rule && M.am[rule.akun] && !M.am[rule.akun].kas ? rule.akun : (jenis === 'masuk' ? (M.am['7-2000'] ? '7-2000' : defaultLawan('masuk')) : (M.am['6-2000'] ? '6-2000' : defaultLawan('keluar')));
    const dup = adaDup.has(tgl + '|' + jenis + '|' + jml);
    out.push({ tgl, ket, jenis, jml, lawan, cocok: !!rule, dup, pakai: !dup });
  });
  return out;
}

// akhir periode laporan tahunan (tahun berjalan belum selesai bila bulan terakhir < Desember)
function akhirLaporan(th) {
  const b = th === new Date().getFullYear() ? bulanAkhir(th) : th + '-12';

  return { b, parsial, lab: parsial ? labelRentang(th + '-01', b, th) : String(th), plab: parsial ? labelRentang((th - 1) + '-01', addYm(b, -12), th - 1) : String(th - 1), untuk: parsial ? 'Untuk periode 1 Januari sampai ' + tglAkhirYm(b) : 'Untuk tahun yang berakhir 31 Desember ' + th, per: 'Per ' + tglAkhirYm(b) };

function kolomLaporan(th, per, tampil) {
  const e = periodeEfektif(th, per);
  if (tampil === 'bulanan' && per[0] !== 'm') {
    const cols = [];
    for (let ym = e.a; ym <= e.b; ym = addYm(ym, 1)) cols.push({ a: ym, b: ym, ym, label: BLN[+ym.slice(5) - 1] });
    cols.push({ a: e.a, b: e.b, ym: e.b, label: 'Total' });
    return { cols, delta: false, e };
  }
  return { cols: [{ a: e.a, b: e.b, ym: e.b, label: e.label }, { a: e.pa, b: e.pb, ym: e.pb, label: e.plabel }], delta: true, e };
}
function renderStatement(lines, cols, o) {
  o = o || {};
  const nc = cols.length + (o.delta ? 2 : 0) + 1;
  const cell = (v, tipe) => (tipe === 'pct' ? '<td class="n">' + (isFinite(v) ? pct(v) : '–') + '</td>' : tipe === 'cek' ? '<td class="n' + (Math.abs(v) < 1 ? '' : ' neg') + '">' + (Math.abs(v) < 1 ? 'Seimbang ✓' : angka(v)) + '</td>' : '<td class="n' + angkaCls(v) + '">' + angkaStrip(v) + '</td>');
  const head = '<thead><tr><th class="sticky">Uraian</th>' + cols.map(c => '<th class="r">' + esc(c.label) + '</th>').join('') + (o.delta ? '<th class="r">Selisih</th><th class="r">%</th>' : '') + '</tr></thead>';
  const body = lines.map(l => {
    if (l.t === 'h' || l.t === 'sub') return '<tr class="' + l.t + '"><td colspan="' + nc + '">' + esc(l.text) + '</td></tr>';
    if (l.t === 'kosong') return '<tr class="kosong"><td colspan="' + nc + '">' + esc(l.text) + '</td></tr>';
    const nama = (l.kode ? '<span class="kode">' + esc(l.kode) + '</span>' : '') + esc(l.text);
    let r = '<tr class="' + l.t + '"><td class="sticky">' + nama + '</td>' + l.v.map(v => cell(v, l.t)).join('');
    if (o.delta) {
      if (l.t === 'pct' || l.t === 'cek') r += '<td></td><td></td>';
      else {
        const d = l.v[0] - l.v[1], g = Math.abs(l.v[1]) > 0.5 ? d / Math.abs(l.v[1]) : NaN;
        r += '<td class="n sel' + angkaCls(d) + '">' + angkaStrip(d) + '</td><td class="n sel pp">' + (isFinite(g) ? (g >= 0 ? '+' : '-') + pct(Math.abs(g)) : '–') + '</td>';
      }

    return r + '</tr>';

function isiLaporan(tab, th, per, tampil) {
  const K = kolomLaporan(th, per, tampil);

  }

  return { judul: 'Neraca Saldo', periode: 'Per ' + tglAkhir(e.b), html, tb, bandingAda };
}

/* ================= Ekspor: Excel (SheetJS) & PDF (jsPDF) ================= */
async function simpanBerkas(nama, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl && !(window.claude && window.claude.use)) {
    // versi mandiri (dipasang sebagai aplikasi atau dibuka di browser biasa): unduh lewat tautan biasa
    try {
      const mime = /\.xlsx$/i.test(nama) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : /\.pdf$/i.test(nama) ? 'application/pdf' : /\.json$/i.test(nama) ? 'application/json' : 'application/octet-stream';
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
      const a = document.createElement('a');
      a.href = url; a.download = nama; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Berkas diunduh: ' + nama); return true;
    } catch (e) { toast('Gagal mengunduh berkas' + (e && e.message ? ': ' + e.message : '.'), true); return false; }
  }
  if (!dl) { toast('Unduhan tidak tersedia di tampilan ini. Buka halaman ini langsung di Claude untuk mengunduh.', true); return false; }
  try { await dl.save({ filename: nama, data }); toast('Berkas siap: ' + nama); return true; }
  catch (e) {
    if (e && e.code === 'declined') return false;
    toast('Gagal menyimpan berkas' + (e && e.message ? ': ' + e.message : '.'), true); return false;
  }
}
const namaPT = () => (M.cfg.perusahaan.bentuk ? M.cfg.perusahaan.bentuk + ' ' : '') + M.cfg.perusahaan.nama;
const slug = s => String(s || 'perusahaan').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'perusahaan';
const serialExcel = t => { const p = t.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - Date.UTC(1899, 11, 30)) / 86400000); };
const FMT_ANGKA = '#,##0;(#,##0);"-"', FMT_PCT = '0.0%', FMT_TGL = 'dd/mm/yyyy';

function pastikanXlsx() {
  if (typeof XLSX === 'undefined') { toast('Pustaka Excel belum termuat. Periksa koneksi lalu muat ulang halaman.', true); return false; }
  return true;
}
// lines -> baris sheet. meta[r] = 'pct' bila baris persentase
function statementAoa(judul, periode, lines, cols, delta, headLabel) {
  const aoa = [[namaPT()], [judul], [periode], []], meta = {};
  const head = [headLabel || 'Uraian'].concat(cols.map(c => c.label));
  if (delta) head.push('Selisih', '%');
  aoa.push(head);
  lines.forEach(l => {
    const r = aoa.length;
    if (l.t === 'h' || l.t === 'sub') { aoa.push([l.text]); return; }
    if (l.t === 'kosong') { aoa.push(['   ' + l.text]); return; }
    const row = [(l.t === 'a' ? '   ' : '') + (l.kode ? l.kode + '  ' : '') + l.text];
    l.v.forEach(v => row.push(isFinite(v) ? Math.round(l.t === 'pct' ? v * 10000 : v * 1) / (l.t === 'pct' ? 10000 : 1) : ''));
    if (l.t === 'pct') meta[r] = 'pct';
    if (delta && l.t !== 'pct' && l.t !== 'cek') {
      const d = l.v[0] - l.v[1];
      row.push(d, Math.abs(l.v[1]) > 0.5 ? d / Math.abs(l.v[1]) : '');
    }
    aoa.push(row);
  });
  return { aoa, meta, delta, nVal: cols.length };
}
function buatSheet(st, lebarPertama) {
  const ws = XLSX.utils.aoa_to_sheet(st.aoa);
  const ref = XLSX.utils.decode_range(ws['!ref']);
  for (let r = 5; r <= ref.e.r; r++) {
    for (let c = 1; c <= ref.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (cell && cell.t === 'n') cell.z = st.meta[r] === 'pct' || (st.delta && c === ref.e.c) ? FMT_PCT : FMT_ANGKA;
    }
  }
  ws['!cols'] = [{ wch: lebarPertama || 46 }].concat(Array.from({ length: ref.e.c }, () => ({ wch: 17 })));
  return ws;
}
function sheetTabel(judul, periode, head, rows, fmt, lebar) {
  const aoa = [[namaPT()], [judul], [periode], [], head].concat(rows);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const ref = XLSX.utils.decode_range(ws['!ref']);
  for (let r = 5; r <= ref.e.r; r++) for (let c = 0; c <= ref.e.c; c++) {
    const cell = ws[XLSX.utils.encode_cell({ r, c })];
    if (cell && cell.t === 'n' && fmt[c]) cell.z = fmt[c];
  }
  ws['!cols'] = lebar.map(w => ({ wch: w }));
  return ws;
}
function sheetRekap(th) {
  const rk = rekapTahun(M, th);
  const head = ['Bulan', 'Pendapatan', 'HPP', 'Laba kotor', 'Beban operasional', 'Laba operasional', 'Laba bersih', 'Margin laba bersih', 'Kas masuk', 'Kas keluar', 'Saldo kas & bank', 'Jumlah transaksi'];
  const row = r => [BULAN[r.m - 1] || 'Total ' + th, r.pend, r.hpp, r.kotor, r.beban, r.oper, r.bersih, isFinite(r.margin) ? r.margin : '', r.kasMasuk, r.kasKeluar, r.saldoKas, r.ntx];
  const rows = rk.rows.map(row).concat([row(rk.total)]);
  const fmt = [null, FMT_ANGKA, FMT_ANGKA, FMT_ANGKA, FMT_ANGKA, FMT_ANGKA, FMT_ANGKA, FMT_PCT, FMT_ANGKA, FMT_ANGKA, FMT_ANGKA, '#,##0'];
  return sheetTabel('Rekap Bulanan', 'Tahun ' + th, head, rows, fmt, [16, 16, 16, 16, 18, 17, 16, 14, 16, 16, 18, 12]);
}
function unduhRekap() {
  if (!pastikanXlsx()) return;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetRekap(UI.tahun), 'Rekap Bulanan');
  simpanBerkas('rekap-bulanan-' + UI.tahun + '-' + slug(M.cfg.perusahaan.nama) + '.xlsx', XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
}
function unduhLaporan() {
  if (!pastikanXlsx()) return;
  const L = UI._lap; if (!L) return;
  const wb = XLSX.utils.book_new();
  let ws;
  if (L.tb) {
    ws = sheetTabel(L.judul, L.periode, ['Kode', 'Nama akun', 'Debit', 'Kredit'], L.tb.rows.map(r => [r.kode, r.nama, r.d || '', r.k || '']).concat([['', 'Total', L.tb.td, L.tb.tk]]), [null, null, FMT_ANGKA, FMT_ANGKA], [12, 40, 18, 18]);
  } else ws = buatSheet(statementAoa(L.judul, L.periode, L.lines, L.cols, L.delta));
  XLSX.utils.book_append_sheet(wb, ws, L.judul.replace(/[^A-Za-z ]/g, '').slice(0, 28) || 'Laporan');
  simpanBerkas(slug(L.judul) + '-' + UI.tahun + '-' + slug(M.cfg.perusahaan.nama) + '.xlsx', XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
}
function unduhExcel() {
  if (!pastikanXlsx()) return;

const pdfTeks = s => String(s == null ? '' : s).replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/✓/g, '').replace(/…/g, '...');
const pdfAngka = n => (Math.abs(n) < 0.5 ? '-' : n < 0 ? '(' + fmtN.format(Math.round(-n)) + ')' : fmtN.format(Math.round(n)));
const PDF = { hijau: [10, 106, 88], gelap: [20, 34, 28], ink: [23, 32, 27], abu: [85, 99, 90], garis: [213, 220, 211], merah: [180, 35, 24], c1: [42, 120, 214], c2: [235, 104, 52], pita: [238, 242, 236], pitaTebal: [222, 236, 230], pitaMuda: [241, 244, 239] };

function buatPdf(th) {
  const { jsPDF } = window.jspdf;

  const warna = (c, mode) => (mode === 'fill' ? doc.setFillColor(c[0], c[1], c[2]) : mode === 'draw' ? doc.setDrawColor(c[0], c[1], c[2]) : doc.setTextColor(c[0], c[1], c[2]));
  const lebar = () => doc.internal.pageSize.getWidth(), tinggi = () => doc.internal.pageSize.getHeight();

  const footer = () => {
    const W = lebar(), H = tinggi(); const n = doc.internal.getCurrentPageInfo().pageNumber;
    warna(PDF.garis, 'draw'); doc.setLineWidth(0.5); doc.line(mx, H - 40, W - mx, H - 40);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); warna(PDF.abu);

  const judulBagian = (t, s) => {
    const W = lebar();
    doc.setFont('times', 'bold'); doc.setFontSize(21); warna(PDF.ink); doc.text(pdfTeks(t), mx, 66);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); warna(PDF.abu); doc.text(pdfTeks(nama + '  |  ' + s), mx, 82);

  };
  const paragraf = (teks, y, ukuran) => {

      if (l.t === 'kosong') return [{ content: '   ' + pdfTeks(l.text), colSpan: nCol, styles: { fontStyle: 'italic', textColor: PDF.abu } }];
      const tebal = l.t === 'tot' || l.t === 'grand' || l.t === 'final';
      const fill = l.t === 'final' ? PDF.pitaTebal : l.t === 'grand' ? PDF.pitaMuda : null;
      const dasar = { fontStyle: tebal ? 'bold' : 'normal' }; if (fill) dasar.fillColor = fill;
      const redup = l.t === 'pct' || l.t === 'cek';

      const baris = [sel((l.t === 'a' ? '   ' : '') + pdfTeks((l.kode ? l.kode + '  ' : '') + l.text), 0, true)];
      l.v.forEach(v => baris.push(sel(l.t === 'pct' ? (isFinite(v) ? pct(v) : '-') : l.t === 'cek' ? (Math.abs(v) < 1 ? 'Seimbang' : pdfAngka(v)) : pdfAngka(v), l.t === 'pct' ? 0 : v)));
      if (delta) {

        else { const d = l.v[0] - l.v[1], g = Math.abs(l.v[1]) > 0.5 ? d / Math.abs(l.v[1]) : NaN; baris.push(sel(pdfAngka(d), d), sel(isFinite(g) ? (g >= 0 ? '+' : '-') + pct(Math.abs(g)) : '-', 0)); }
      }
      return baris;
    });
    const sisi = lebar() - 2 * mx, wV = delta ? 70 : 84, cs = { 0: { cellWidth: sisi - (nCol - 1) * wV } };
    for (let i = 1; i < nCol; i++) cs[i] = { cellWidth: wV };

    doc.autoTable({

      columnStyles: cs, didDrawPage: footer,

    return doc.lastAutoTable.finalY;
  };

  /* Sampul */
  {
    const W = lebar(), H = tinggi();
    warna(PDF.gelap, 'fill'); doc.rect(0, 0, W, H * 0.5, 'F');
    warna(PDF.hijau, 'fill'); doc.rect(mx, H * 0.5 - 6, 64, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(140, 215, 190); try { doc.setCharSpace(2); } catch (e) { /* versi lama */ }
    doc.text('LAPORAN KEUANGAN TAHUNAN', mx, 150); try { doc.setCharSpace(0); } catch (e) { /* abaikan */ }

    doc.setFontSize(10.5); warna(PDF.ink);
    let y = H * 0.5 + 56;

  }

  /* Ringkasan eksekutif */
  doc.addPage();
  {
    let y = judulBagian('Ringkasan Eksekutif', 'Tahun ' + th);
    if (tk.pengantar) y = paragraf(tk.pengantar, y, 10) + 4;
    const W = lebar() - 2 * mx, w4 = W / 4;
    warna(PDF.ink, 'draw'); doc.setLineWidth(1); doc.line(mx, y, mx + W, y);
    re.kpi.forEach((k, i) => {
      const x = mx + i * w4 + (i ? 10 : 0);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); warna(PDF.abu); doc.text(pdfTeks(k.label), x, y + 16);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); warna(PDF.ink); doc.text(pdfTeks(rpK(k.v)), x, y + 34);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); warna(PDF.abu);
      doc.text(k.p != null && Math.abs(k.p) > 0.5 ? (k.v >= k.p ? '+' : '-') + pct(Math.abs((k.v - k.p) / Math.abs(k.p))) + ' dari ' + (k.label === 'Saldo Kas & Bank' ? 'awal tahun' : th - 1) : 'Belum ada pembanding', x, y + 48);
      if (i) { warna(PDF.garis, 'draw'); doc.setLineWidth(0.5); doc.line(mx + i * w4, y + 6, mx + i * w4, y + 54); }
    });
    warna(PDF.garis, 'draw'); doc.setLineWidth(0.5); doc.line(mx, y + 62, mx + W, y + 62);
    y = paragraf(re.paragraf.join('\n'), y + 84, 10);
    // grafik kolom
    const rk = re.rk, gx = mx + 44, gw = W - 44, gy = y + 26, gh = 150;
    if (gy + gh + 60 < tinggi()) {

      const mx2 = Math.max(1, ...rk.rows.map(r => Math.max(r.pend, r.totalBeban)));
      const sc = niceTicks(0, mx2, 4);
      const Y = v => gy + gh - (v / sc.hi) * gh;

      const gwid = gw / 12, bw = Math.min(11, gwid * 0.34);

  {

async function unduhPdf() {
  if (!(window.jspdf && window.jspdf.jsPDF) || !window.jspdf.jsPDF.API || !window.jspdf.jsPDF.API.autoTable) { toast('Pustaka PDF belum termuat. Periksa koneksi lalu muat ulang halaman.', true); return; }
  UI.pdfBusy = true; render();
  await new Promise(r => setTimeout(r, 40));
  try {
    const doc = buatPdf(UI.tahun);
    await simpanBerkas('laporan-tahunan-' + UI.tahun + '-' + slug(M.cfg.perusahaan.nama) + '.pdf', doc.output('arraybuffer'));
  } catch (e) { console.error(e); toast('Gagal menyusun PDF: ' + ((e && e.message) || 'kesalahan tidak diketahui'), true); }
  UI.pdfBusy = false; render();
}

function setUiPath(path, v) {

  if (p[0] === 'kas') UI.kas.lim = 100;
  if (p[0] === 'jurnal') UI.jurnal.lim = 60;
}

}
